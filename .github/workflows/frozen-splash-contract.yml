name: Frozen splash contract

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

jobs:
  verify-frozen-splash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify checked-in splash contract
        run: npm run test:splash-contract

      - name: Regenerate native projects cleanly
        run: npx expo prebuild --clean --no-install

      - name: Verify generated native splash contract
        run: node scripts/verify-frozen-splash.mjs
