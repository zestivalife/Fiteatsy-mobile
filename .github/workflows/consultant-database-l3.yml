name: Consultant Database L3

on:
  workflow_dispatch:
  push:
    branches:
      - codex/consultant-platform-audit-20260901
      - codex/diet-lifecycle-quality-v1
      - codex/food-preference-sync-v1
      - codex/food-knowledge-db-v1
      - codex/controlled-indian-food-curation-v1
      - codex/diet-module-unified-option-model-v17.9
      - codex/governed-qa-handoff-v17.12
      - codex/consultant-meal-templates-v17.25

permissions:
  contents: read

jobs:
  consultant-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fiteatsy_test
          POSTGRES_PASSWORD: fiteatsy_test
          POSTGRES_DB: fiteatsy_consultant_l3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiteatsy_test -d fiteatsy_consultant_l3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://fiteatsy_test:fiteatsy_test@127.0.0.1:5432/fiteatsy_consultant_l3_test
      FITEATSY_ALLOW_DESTRUCTIVE_TEST_RESET: "true"
      FITEATSY_TEST_ENVIRONMENT: consultant-database-l3-test
      REPORTS_STORAGE_ROOT: /tmp/fiteatsy-consultant-l3-reports
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4

      - name: Record checked-out source SHA
        run: git rev-parse HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked backend dependencies
        run: npm ci --prefix backend

      - name: Apply production migrations to ephemeral PostgreSQL
        run: npm --prefix backend run db:migrate

      - name: Build production importer artifact
        run: npm --prefix backend run build

      - name: Validate and import immutable Batch 0 catalogue
        working-directory: backend
        shell: bash
        run: |
          set +e
          {
            npm run food-catalogue:test &&
            npm run food-catalogue:batch0:dry-run &&
            npm run food-catalogue:batch0:import &&
            npm run food-catalogue:batch0:import
          } > batch0-import.log 2>&1
          status=$?
          cat batch0-import.log
          if [ "$status" -ne 0 ]; then
            failure_block="$(tail -n 100 batch0-import.log)"
            escaped="${failure_block//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            echo "::error title=Batch 0 catalogue acceptance::$escaped"
          fi
          exit "$status"

      - name: Run Diet Lifecycle Quality v1 contracts
        working-directory: backend
        run: >-
          node --import tsx --test --test-concurrency=1
          ../tests/backend/nutrition-food-preference-contract.test.ts
          ../tests/backend/nutrition-architecture-freeze.test.ts
          ../tests/backend/simple-consultant-approval-workflow.test.ts
          ../tests/backend/qa-browser-handoff-v17-13.test.ts

      - name: Run Diet Lifecycle Quality v1 database acceptance
        working-directory: backend
        run: node --import tsx --test --test-concurrency=1 ../tests/database/diet-lifecycle-quality.database.test.ts

      - name: Run authenticated Common Food source E2E
        working-directory: backend
        shell: bash
        run: |
          set +e
          node --import tsx --test --test-concurrency=1 \
            ../tests/api/common-food-authenticated-e2e.api.test.ts \
            ../tests/api/qa-session-handoff.api.test.ts \
            ../tests/api/qa-provisioning.api.test.ts \
            > common-food-authenticated-e2e.log 2>&1
          status=$?
          cat common-food-authenticated-e2e.log
          if [ "$status" -ne 0 ]; then
            failure_block="$(tail -n 120 common-food-authenticated-e2e.log)"
            escaped="${failure_block//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            echo "::error title=Authenticated Common Food E2E::$escaped"
          fi
          exit "$status"

      - name: Run Consultant database lifecycle contracts
        working-directory: backend
        shell: bash
        run: |
          set +e
          node --import tsx --test --test-concurrency=1 \
            ../tests/api/admin-role-management.api.test.ts \
            ../tests/api/consultants.api.test.ts \
            ../tests/api/subscriptions.api.test.ts \
            > consultant-database-l3.log 2>&1
          status=$?
          cat consultant-database-l3.log
          if [ "$status" -ne 0 ]; then
            failure_block="$(awk '
              /^not ok / { capture = 1 }
              capture { print }
              capture && /^  \.\.\.$/ { exit }
            ' consultant-database-l3.log | tail -n 80)"
            escaped="${failure_block//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            echo "::error title=Consultant database L3::$escaped"
          fi
          exit "$status"

      - name: Run Food Knowledge v1 database acceptance
        working-directory: backend
        shell: bash
        run: |
          set +e
          node --import tsx --test --test-concurrency=1 \
            ../tests/backend/food-knowledge-foundation.test.ts \
            ../tests/database/food-knowledge-foundation.database.test.ts \
            > food-knowledge-v1.log 2>&1
          status=$?
          cat food-knowledge-v1.log
          if [ "$status" -ne 0 ]; then
            failure_block="$(awk '
              /^not ok / { capture = 1 }
              capture { print }
              capture && /^  \.\.\.$/ { exit }
            ' food-knowledge-v1.log | tail -n 100)"
            escaped="${failure_block//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            echo "::error title=Food Knowledge v1 database acceptance::$escaped"
          fi
          exit "$status"

      - name: Run controlled Indian Food curation contracts
        working-directory: backend
        run: npm run food-curation:test

      - name: Run full safe backend regression against ephemeral PostgreSQL
        working-directory: backend
        shell: bash
        run: |
          mapfile -t regression_tests < <(find ../tests/api ../tests/backend ../tests/database \
            -name '*.test.ts' \
            ! -name 'diet-lifecycle-quality.database.test.ts' \
            -print | sort)
          node --import tsx --test --test-concurrency=1 "${regression_tests[@]}"

      - name: Build backend
        run: npm --prefix backend run build
